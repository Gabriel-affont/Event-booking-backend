services:
  - type: pserv
    name: eventbooking-db
    env: docker
    plan: starter
    region: oregon
    postgresDatabase: eventbooking  
    postgresUser: eventbooking_user  

  - type: web
    name: eventbooking-api
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: eventbooking-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: EventBookingApi
      - key: Jwt__Audience
        value: EventBookingFrontend
      - key: ASPNETCORE_URLS
        value: http://+:8080